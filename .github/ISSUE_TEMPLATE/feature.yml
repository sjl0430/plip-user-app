name: Feature
description: 신규 기능·화면·API 연동
title: "[Feature] "
labels:
  - Feature
body:
  - type: markdown
    attributes:
      value: |
        `[Feature]` 뒤에 한글로 구체적인 요약을 적어 주세요.
        예: `[Feature] 로그인 화면 추가`
  - type: textarea
    id: summary
    attributes:
      label: 개요
      description: 무엇을, 왜 추가하는지
      placeholder: 사용자가 이메일/비밀번호로 로그인할 수 있어야 합니다.
    validations:
      required: true
  - type: checkboxes
    id: tasks
    attributes:
      label: 작업 내용
      description: 구현할 항목을 체크리스트로 나눕니다.
      options:
        - label: UI (Atomic Design 계층 준수)
        - label: Server Action / Service / lib/api 연동
        - label: 타입·zod 스키마
  - type: textarea
    id: references
    attributes:
      label: 참고
      description: Figma, Notion, Swagger 등 링크
      placeholder: https://...
