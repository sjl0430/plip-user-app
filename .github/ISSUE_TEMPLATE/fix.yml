name: Fix
description: 버그 수정
title: "[Fix] "
labels:
  - Fix
body:
  - type: textarea
    id: reproduce
    attributes:
      label: 재현 방법
      placeholder: 1. 로그인 후 … 2. …
    validations:
      required: true
  - type: textarea
    id: cause
    attributes:
      label: 원인
      placeholder: 세션 만료 시 …
  - type: checkboxes
    id: fixes
    attributes:
      label: 수정 항목
      options:
        - label: 원인 수정
        - label: 회귀 테스트 / 수동 확인
  - type: textarea
    id: references
    attributes:
      label: 참고
      placeholder: 로그, 스크린샷, Notion 링크
